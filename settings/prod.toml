profile = "prod"

[server]
addr = "0.0.0.0"
port = 8_080

# Per-client-IP rate limiting, enabled for production.
#
# Tuned so an ordinary page load is invisible to it. A single-page app renders
# one screen from a dozen or so requests — the events page needs about eleven —
# so a burst smaller than that means no page ever loads (GH #70). The previous
# values here (one token per 25 seconds, burst 50) let the first screen through
# and then throttled everything after it to one request every 25 seconds.
#
# `rate_limit_period_secs` is a *period*: one request's worth of budget is
# restored every this many seconds. 1 gives roughly 60 requests a minute
# sustained, with 120 available in a burst. Credential brute-forcing is handled
# separately and much more tightly by the auth limiter below, which is why this
# one can afford to be generous.
#
# `trust_proxy_headers` is true here because the typical ZoneMinder deployment
# runs zm-api behind a reverse proxy that sets X-Forwarded-For. If you expose
# zm-api directly, set this to false so the peer IP is used and forwarding
# headers can't be spoofed to bypass the limiter.
[server.middleware]
body_limit_bytes = 2097152
rate_limit_period_secs = 1
rate_limit_burst = 120
trust_proxy_headers = true
auth_rate_limit_period_secs = 2
auth_rate_limit_burst = 10

# Database configuration
# By default, uses ZoneMinder's zm.conf settings (/etc/zm/zm.conf + conf.d/)
# Override here or via environment variables (APP_DB__HOST, etc.) if needed
[db]
# These placeholder values trigger zm.conf fallback
host = "localhost"
port = 3306
username = "username"
password = "password"
database_name = "database_name"
max_connections = 25

[sentry]
enabled = false
dsn = ""

[secret]
private_access_key = "/var/lib/zm-api/keys/private_access_rsa_key.pem"
public_access_key = "/var/lib/zm-api/keys/public_access_rsa_key.pem"
private_refresh_key = "/var/lib/zm-api/keys/private_refresh_rsa_key.pem"
public_refresh_key = "/var/lib/zm-api/keys/public_refresh_rsa_key.pem"

[http]
timeout = 10
